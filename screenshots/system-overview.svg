  <rect x="250" y="230" width="140" height="28" rx="5" fill="#0f172a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="248" text-anchor="middle" fill="#86efac" font-size="10">GET /api/healthz ✅</text>
  <rect x="250" y="266" width="140" height="28" rx="5" fill="#0f172a" stroke="#334155" stroke-dasharray="4,3"/>
  <text x="320" y="284" text-anchor="middle" fill="#475569" font-size="10">POST /api/readings 📌</text>

