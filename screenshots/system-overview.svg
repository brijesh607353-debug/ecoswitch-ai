  <rect x="50" y="158" width="120" height="30" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="178" text-anchor="middle" fill="#cbd5e1" font-size="10">Current Sensors</text>

  <!-- Arrow IoT → API -->
  <line x1="190" y1="140" x2="230" y2="140" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>
  <text x="210" y="132" text-anchor="middle" fill="#475569" font-size="8">HTTP</text>

  <!-- API Layer -->
  <rect x="230" y="80" width="180" height="220" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="1.5"/>
