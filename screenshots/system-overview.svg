<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">EcoSwitch AI — System Overview</text>
  <text x="400" y="58" text-anchor="middle" fill="#64748b" font-size="12">v0.1.0 · Active Development</text>

  <!-- IoT Layer -->
  <rect x="30" y="80" width="160" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">🔌 IoT LAYER</text>
  <text x="110" y="113" text-anchor="middle" fill="#64748b" font-size="9">Planned</text>
  <rect x="50" y="120" width="120" height="30" rx="5" fill="#0f172a" stroke="#334155"/>
