  <rect x="182" y="358" width="120" height="28" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="242" y="376" text-anchor="middle" fill="#cbd5e1" font-size="10">shadcn/ui · 50+ cmpts</text>
  <rect x="314" y="358" width="120" height="28" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="374" y="376" text-anchor="middle" fill="#cbd5e1" font-size="10">React Query v5</text>
  <rect x="446" y="358" width="120" height="28" rx="5" fill="#0f172a" stroke="#334155" stroke-dasharray="4,3"/>
  <text x="506" y="376" text-anchor="middle" fill="#475569" font-size="10">Recharts 📌</text>

  <!-- Legend -->
  <rect x="640" y="80" width="140" height="110" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="710" y="98" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Legend</text>
  <rect x="654" y="108" width="10" height="10" rx="2" fill="#16a34a"/>
  <text x="670" y="118" fill="#94a3b8" font-size="9">✅ Implemented</text>
  <rect x="654" y="124" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="670" y="134" fill="#94a3b8" font-size="9">🚧 In Progress</text>
  <rect x="654" y="140" width="10" height="10" rx="2" fill="#475569"/>
  <text x="670" y="150" fill="#94a3b8" font-size="9">📌 Planned</text>
  <line x1="654" y1="162" x2="680" y2="162" stroke="#16a34a" stroke-width="1.5"/>
  <text x="686" y="166" fill="#94a3b8" font-size="9">Active link</text>
  <line x1="654" y1="176" x2="680" y2="176" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="686" y="180" fill="#94a3b8" font-size="9">Planned link</text>

  <!-- Defs -->
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
