<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">EcoSwitch AI — IoT Hardware Layer</text>
  <text x="400" y="55" text-anchor="middle" fill="#f59e0b" font-size="11">📌 Planned — Requires ESP32 Hardware</text>

  <!-- Power source -->
  <rect x="30" y="90" width="120" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="90" y="116" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">AC Power Line</text>
  <text x="90" y="132" text-anchor="middle" fill="#64748b" font-size="9">230V / 50Hz</text>

  <!-- Arrow power → sensors -->
  <line x1="150" y1="120" x2="190" y2="120" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#hw-arr)"/>

  <!-- Sensors block -->
  <rect x="190" y="80" width="150" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="100" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="600">Sensors</text>
  <rect x="206" y="110" width="118" height="38" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="265" y="127" text-anchor="middle" fill="#cbd5e1" font-size="10">SCT-013</text>
  <text x="265" y="141" text-anchor="middle" fill="#64748b" font-size="9">Non-invasive current clamp</text>
  <rect x="206" y="156" width="118" height="38" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="265" y="173" text-anchor="middle" fill="#cbd5e1" font-size="10">ZMPT101B</text>
  <text x="265" y="187" text-anchor="middle" fill="#64748b" font-size="9">AC voltage sensor</text>
  <rect x="206" y="202" width="118" height="28" rx="5" fill="#0f172a" stroke="#334155" stroke-dasharray="3,3"/>
  <text x="265" y="220" text-anchor="middle" fill="#475569" font-size="9">Optional: OLED display</text>

  <!-- Arrow sensors → ESP32 -->
  <line x1="340" y1="160" x2="390" y2="160" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#hw-yel)"/>
  <text x="365" y="152" text-anchor="middle" fill="#64748b" font-size="8">ADC</text>

  <!-- ESP32 -->
  <rect x="390" y="80" width="180" height="200" rx="8" fill="#1e293b" stroke="#e7352c" stroke-width="2"/>
  <text x="480" y="102" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">ESP32 MCU</text>
  <text x="480" y="118" text-anchor="middle" fill="#64748b" font-size="9">Main controller</text>
  <rect x="406" y="128" width="148" height="26" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="145" text-anchor="middle" fill="#cbd5e1" font-size="10">Wi-Fi 802.11 b/g/n</text>
  <rect x="406" y="162" width="148" height="26" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="179" text-anchor="middle" fill="#cbd5e1" font-size="10">ADC reading (12-bit)</text>
  <rect x="406" y="196" width="148" height="26" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="213" text-anchor="middle" fill="#cbd5e1" font-size="10">JSON payload build</text>
  <rect x="406" y="230" width="148" height="26" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="247" text-anchor="middle" fill="#cbd5e1" font-size="10">HTTPS POST /api/readings</text>
  <rect x="406" y="264" width="148" height="26" rx="5" fill="#0f172a" stroke="#334155" stroke-dasharray="3,3"/>
  <text x="480" y="281" text-anchor="middle" fill="#475569" font-size="10">OTA firmware update 📌</text>

  <!-- Arrow ESP32 → API -->
  <line x1="570" y1="160" x2="620" y2="160" stroke="#e7352c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#hw-red)"/>
  <text x="595" y="152" text-anchor="middle" fill="#64748b" font-size="8">Wi-Fi</text>
  <text x="595" y="170" text-anchor="middle" fill="#64748b" font-size="8">HTTPS</text>

  <!-- API Server stub -->
  <rect x="620" y="80" width="150" height="90" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="1.5"/>
  <text x="695" y="102" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">API Server</text>
  <rect x="636" y="112" width="118" height="26" rx="5" fill="#0f172a" stroke="#334155" stroke-dasharray="3,3"/>
  <text x="695" y="129" text-anchor="middle" fill="#475569" font-size="9">POST /api/readings 📌</text>
  <rect x="636" y="146" width="118" height="20" rx="5" fill="#0f172a" stroke="#16a34a"/>
  <text x="695" y="160" text-anchor="middle" fill="#86efac" font-size="9">GET /api/healthz ✅</text>

  <!-- Sample payload -->
  <rect x="190" y="310" width="560" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="210" y="330" fill="#94a3b8" font-size="10" font-weight="600">Sample ESP32 Payload (Planned)</text>
  <text x="210" y="350" fill="#64748b" font-size="9" font-family="monospace">{"deviceId": "esp32-01", "timestamp": "2026-07-27T10:00:00Z",</text>
  <text x="210" y="366" fill="#64748b" font-size="9" font-family="monospace">  "readings": {"voltage_v": 231.2, "current_a": 3.1, "power_w": 716.7,</text>
  <text x="210" y="382" fill="#64748b" font-size="9" font-family="monospace">               "energy_kwh": 0.011, "power_factor": 0.99}}</text>

  <defs>
    <marker id="hw-arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
    <marker id="hw-yel" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="hw-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e7352c"/></marker>
  </defs>
</svg>
