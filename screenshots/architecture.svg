<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="420" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">EcoSwitch AI — API Architecture</text>
  <text x="400" y="56" text-anchor="middle" fill="#64748b" font-size="11">Contract-First OpenAPI → Codegen → Type-Safe Stack</text>

  <!-- OpenAPI Spec -->
  <rect x="50" y="80" width="160" height="70" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">OpenAPI 3.1 Spec</text>
  <text x="130" y="120" text-anchor="middle" fill="#64748b" font-size="10">lib/api-spec/</text>
  <text x="130" y="135" text-anchor="middle" fill="#64748b" font-size="10">openapi.yaml</text>

  <!-- Arrow → Codegen -->
  <line x1="210" y1="115" x2="270" y2="115" stroke="#16a34a" stroke-width="2" marker-end="url(#a-grn)"/>

  <!-- Orval Codegen -->
  <rect x="270" y="80" width="160" height="70" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="108" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Orval Codegen</text>
  <text x="350" y="125" text-anchor="middle" fill="#64748b" font-size="10">lib/api-spec/</text>
  <text x="350" y="140" text-anchor="middle" fill="#64748b" font-size="10">orval.config.ts</text>

  <!-- Arrow → Hooks -->
  <line x1="430" y1="100" x2="500" y2="100" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-pur)"/>
  <!-- Arrow → Schemas -->
  <line x1="430" y1="130" x2="500" y2="155" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-pur)"/>

  <!-- React Query Hooks -->
  <rect x="500" y="70" width="160" height="55" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="580" y="92" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">React Query Hooks</text>
  <text x="580" y="107" text-anchor="middle" fill="#64748b" font-size="9">lib/api-client-react/</text>
  <text x="580" y="118" text-anchor="middle" fill="#64748b" font-size="9">generated/api.ts</text>

  <!-- Zod Schemas -->
  <rect x="500" y="140" width="160" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="162" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Zod Schemas + Types</text>
  <text x="580" y="177" text-anchor="middle" fill="#64748b" font-size="9">lib/api-zod/</text>
  <text x="580" y="188" text-anchor="middle" fill="#64748b" font-size="9">generated/</text>

  <!-- Horizontal separator -->
  <line x1="50" y1="230" x2="750" y2="230" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="248" text-anchor="middle" fill="#334155" font-size="10">Runtime</text>

  <!-- Frontend box -->
  <rect x="50" y="260" width="220" height="100" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="160" y="280" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="600">Frontend</text>
  <text x="160" y="295" text-anchor="middle" fill="#64748b" font-size="9">artifacts/mockup-sandbox</text>
  <rect x="68" y="305" width="185" height="25" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="160" y="321" text-anchor="middle" fill="#94a3b8" font-size="10">shadcn/ui + React Query</text>
  <rect x="68" y="335" width="185" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="160" y="349" text-anchor="middle" fill="#64748b" font-size="9">useHealthCheck() — generated hook</text>

  <!-- Arrow hooks → frontend -->
  <line x1="580" y1="125" x2="580" y2="265" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
  <line x1="580" y1="265" x2="275" y2="300" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- API Server box -->
  <rect x="310" y="260" width="220" height="100" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="280" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">API Server</text>
  <text x="420" y="295" text-anchor="middle" fill="#64748b" font-size="9">artifacts/api-server</text>
  <rect x="326" y="305" width="185" height="25" rx="4" fill="#0f172a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="321" text-anchor="middle" fill="#86efac" font-size="10">GET /api/healthz ✅</text>
  <rect x="326" y="335" width="185" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="420" y="349" text-anchor="middle" fill="#64748b" font-size="9">Pino · CORS · Zod</text>

  <!-- Arrow schemas → server -->
  <line x1="580" y1="195" x2="580" y2="265" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a-yel)"/>
  <line x1="580" y1="265" x2="535" y2="280" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a-yel)"/>

  <!-- Database box -->
  <rect x="570" y="260" width="180" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="660" y="280" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Database</text>
  <text x="660" y="295" text-anchor="middle" fill="#64748b" font-size="9">lib/db — Drizzle ORM</text>
  <rect x="586" y="305" width="148" height="25" rx="4" fill="#0f172a" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="321" text-anchor="middle" fill="#86efac" font-size="10">PostgreSQL ✅</text>
  <rect x="586" y="335" width="148" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-dasharray="4,3"/>
  <text x="660" y="349" text-anchor="middle" fill="#475569" font-size="9">Schema pending v0.2.0</text>

  <!-- Arrow server → db -->
  <line x1="530" y1="310" x2="570" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#a-gry)"/>

  <!-- Defs -->
  <defs>
    <marker id="a-grn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="a-pur" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="a-yel" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="a-gry" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
  </defs>
</svg>
