<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="300" fill="#0f172a" rx="12"/>
  <text x="400" y="34" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">EcoSwitch AI — Development Workflow</text>

  <!-- Step 1 -->
  <rect x="20" y="64" width="130" height="80" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
  <text x="85" y="88" text-anchor="middle" fill="#86efac" font-size="22">1</text>
  <text x="85" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Edit OpenAPI</text>
  <text x="85" y="124" text-anchor="middle" fill="#64748b" font-size="9">lib/api-spec/</text>
  <text x="85" y="136" text-anchor="middle" fill="#64748b" font-size="9">openapi.yaml</text>

  <line x1="150" y1="104" x2="185" y2="104" stroke="#16a34a" stroke-width="2" marker-end="url(#wf-g)"/>

  <!-- Step 2 -->
  <rect x="185" y="64" width="130" height="80" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="88" text-anchor="middle" fill="#c4b5fd" font-size="22">2</text>
  <text x="250" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Run Codegen</text>
  <text x="250" y="124" text-anchor="middle" fill="#64748b" font-size="9">pnpm --filter</text>
  <text x="250" y="136" text-anchor="middle" fill="#64748b" font-size="9">api-spec run codegen</text>

  <line x1="315" y1="104" x2="350" y2="104" stroke="#7c3aed" stroke-width="2" marker-end="url(#wf-p)"/>

  <!-- Step 3 -->
  <rect x="350" y="64" width="130" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="415" y="88" text-anchor="middle" fill="#7dd3fc" font-size="22">3</text>
  <text x="415" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Implement Route</text>
  <text x="415" y="124" text-anchor="middle" fill="#64748b" font-size="9">artifacts/api-server/</text>
  <text x="415" y="136" text-anchor="middle" fill="#64748b" font-size="9">src/routes/</text>

  <line x1="480" y1="104" x2="515" y2="104" stroke="#0ea5e9" stroke-width="2" marker-end="url(#wf-b)"/>

  <!-- Step 4 -->
  <rect x="515" y="64" width="130" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="88" text-anchor="middle" fill="#fcd34d" font-size="22">4</text>
  <text x="580" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Wire Frontend</text>
  <text x="580" y="124" text-anchor="middle" fill="#64748b" font-size="9">useGeneratedHook()</text>
  <text x="580" y="136" text-anchor="middle" fill="#64748b" font-size="9">React Query</text>

  <line x1="645" y1="104" x2="680" y2="104" stroke="#f59e0b" stroke-width="2" marker-end="url(#wf-y)"/>

  <!-- Step 5 -->
  <rect x="680" y="64" width="100" height="80" rx="8" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="88" text-anchor="middle" fill="#86efac" font-size="22">5</text>
  <text x="730" y="108" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Typecheck</text>
  <text x="730" y="124" text-anchor="middle" fill="#64748b" font-size="9">pnpm run</text>
  <text x="730" y="136" text-anchor="middle" fill="#64748b" font-size="9">typecheck</text>

  <!-- CI strip -->
  <rect x="20" y="170" width="760" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="192" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">CI — GitHub Actions (.github/workflows/ci.yml)</text>
  <rect x="30" y="200" width="180" height="12" rx="3" fill="#16a34a" fill-opacity="0.7"/>
  <text x="120" y="210" text-anchor="middle" fill="white" font-size="8">pnpm run typecheck</text>
  <rect x="220" y="200" width="180" height="12" rx="3" fill="#7c3aed" fill-opacity="0.7"/>
  <text x="310" y="210" text-anchor="middle" fill="white" font-size="8">pnpm prettier --check</text>
  <rect x="410" y="200" width="180" height="12" rx="3" fill="#334155" fill-opacity="0.7" stroke-dasharray="3,3"/>
  <text x="500" y="210" text-anchor="middle" fill="#64748b" font-size="8">unit tests (planned v0.2.0)</text>
  <rect x="600" y="200" width="170" height="12" rx="3" fill="#334155" fill-opacity="0.7" stroke-dasharray="3,3"/>
  <text x="685" y="210" text-anchor="middle" fill="#64748b" font-size="8">E2E tests (planned v0.8.0)</text>

  <!-- Git flow -->
  <rect x="20" y="240" width="760" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="258" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Git Workflow — Conventional Commits</text>
  <text x="400" y="276" text-anchor="middle" fill="#64748b" font-size="9">feat/* · fix/* · docs/* · chore/*   →   PR to main   →   Squash merge</text>

  <defs>
    <marker id="wf-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/></marker>
    <marker id="wf-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
    <marker id="wf-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="wf-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
