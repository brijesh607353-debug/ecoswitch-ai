name: ✨ Feature Request
description: Suggest a new feature or improvement for EcoSwitch AI
title: "feat: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues first to avoid duplicates.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Database / Schema
        - Dashboard / UI
        - Firebase / Auth
        - IoT / ESP32
        - PWA / Offline
        - Analytics / Reports
        - PDF Export
        - Notifications
        - Documentation
        - Infrastructure / DevOps
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
      placeholder: "As a [user type], I need [capability] because [reason]."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your proposed implementation or behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought of?

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Are you willing to open a PR for this?
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
